name: Post-Deploy Smoke

on:
  workflow_dispatch:
    inputs:
      frontend_url:
        description: Frontend deployment URL to smoke test
        required: false
        default: https://samudhyanrides.vercel.app
        type: string
      backend_url:
        description: Backend deployment URL to smoke test
        required: false
        default: https://samudhyanrides-api.purplerock-a57ae792.francecentral.azurecontainerapps.io
        type: string
  workflow_call:
    inputs:
      frontend_url:
        required: true
        type: string
      backend_url:
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      SMOKE_FRONTEND_URL: ${{ inputs.frontend_url || vars.PRODUCTION_FRONTEND_URL || 'https://samudhyanrides.vercel.app' }}
      SMOKE_BACKEND_URL: ${{ inputs.backend_url || vars.PRODUCTION_BACKEND_URL || 'https://samudhyanrides-api.purplerock-a57ae792.francecentral.azurecontainerapps.io' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Check backend health
        run: npm run smoke:backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: frontend

      - name: Run frontend smoke tests
        run: npm run test:smoke
        working-directory: frontend
        env:
          PW_BASE_URL: ${{ env.SMOKE_FRONTEND_URL }}

      - name: Upload smoke artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
