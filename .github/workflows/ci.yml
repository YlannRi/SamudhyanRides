name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan repository for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python audit tooling
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit backend Python dependencies
        run: pip-audit -r backend/requirements.txt --strict

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Audit root Node dependencies
        run: npm audit --package-lock-only --omit=dev --audit-level=high

      - name: Audit frontend Node dependencies
        run: npm audit --package-lock-only --omit=dev --audit-level=high
        working-directory: frontend

  api-contracts:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend and OpenAPI validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest openapi-spec-validator

      - name: Validate generated OpenAPI document
        run: python scripts/validate_openapi.py

      - name: Run API contract tests
        run: pytest tests/test_api_contracts.py

      - name: Upload generated OpenAPI artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-openapi
          path: backend/openapi.generated.json
          if-no-files-found: error

  database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Start local Supabase stack
        run: npm run db:start

      - name: Reset local database
        run: npm run db:reset

      - name: Run pgTAP database tests
        run: npm run db:test

      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop --project-id SamudhyanRides

  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov coverage

      - name: Set test environment variables
        run: |
          echo "SUPABASE_URL=https://example.supabase.co" >> "$GITHUB_ENV"
          echo "SUPABASE_KEY=dummy-test-key" >> "$GITHUB_ENV"

      - name: Run backend tests with coverage
        run: pytest --cov=app --cov=main --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Upload backend coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit tests with coverage
        run: npm run test:coverage

      - name: Upload frontend coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: |
            frontend/coverage/lcov.info
            frontend/coverage/index.html
            frontend/coverage/lcov-report/**
          if-no-files-found: error

      - name: Build frontend
        run: npm run build

  frontend-e2e:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Run Playwright accessibility tests
        run: npm run test:a11y

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  deploy:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.AZURE_ACR_NAME }}.azurecr.io
          username: ${{ secrets.AZURE_ACR_USERNAME }}
          password: ${{ secrets.AZURE_ACR_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -f backend/Dockerfile -t ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/${{ secrets.AZURE_CONTAINER_APP_NAME }}:${{ github.sha }} backend
          docker push ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/${{ secrets.AZURE_CONTAINER_APP_NAME }}:${{ github.sha }}

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name ${{ secrets.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/${{ secrets.AZURE_CONTAINER_APP_NAME }}:${{ github.sha }}
