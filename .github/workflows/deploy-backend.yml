name: Deploy Backend

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

env:
  AZURE_CORE_OUTPUT: none
  PRODUCTION_FRONTEND_URL: ${{ vars.PRODUCTION_FRONTEND_URL || 'https://samudhyanrides.vercel.app' }}
  PRODUCTION_BACKEND_URL: ${{ vars.PRODUCTION_BACKEND_URL || 'https://samudhyanrides-api.purplerock-a57ae792.francecentral.azurecontainerapps.io' }}

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          missing=0
          for key in AZURE_ACR_NAME AZURE_CONTAINER_APP_NAME AZURE_RESOURCE_GROUP; do
            if [ -z "${!key:-}" ]; then
              echo "::error title=Missing GitHub variable::$key is required for backend deployment."
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
        env:
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          AZURE_CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and deploy backend Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          appSourcePath: ${{ github.workspace }}/backend
          acrName: ${{ vars.AZURE_ACR_NAME }}
          containerAppName: ${{ vars.AZURE_CONTAINER_APP_NAME }}
          resourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
          imageToBuild: ${{ vars.AZURE_ACR_NAME }}.azurecr.io/samudhyanrides-backend:${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

  smoke:
    needs: deploy
    uses: ./.github/workflows/post-deploy-smoke.yml
    with:
      frontend_url: ${{ vars.PRODUCTION_FRONTEND_URL || 'https://samudhyanrides.vercel.app' }}
      backend_url: ${{ vars.PRODUCTION_BACKEND_URL || 'https://samudhyanrides-api.purplerock-a57ae792.francecentral.azurecontainerapps.io' }}
