name: Deploy Backend

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

env:
  AZURE_CORE_OUTPUT: none
  PRODUCTION_FRONTEND_URL: ${{ vars.PRODUCTION_FRONTEND_URL || 'https://samudhyanrides.vercel.app' }}
  PRODUCTION_BACKEND_URL: ${{ vars.PRODUCTION_BACKEND_URL || 'https://samudhyanrides-api.purplerock-a57ae792.francecentral.azurecontainerapps.io' }}

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          missing=0
          for key in AZURE_ACR_NAME AZURE_CONTAINER_APP_NAME AZURE_RESOURCE_GROUP; do
            if [ -z "${!key:-}" ]; then
              echo "::error title=Missing GitHub variable::$key is required for backend deployment."
              missing=1
            fi
          done

          if [ -n "${AZURE_CREDENTIALS:-}" ]; then
            python - <<'PY'
import json
import os
import sys

raw = os.environ.get("AZURE_CREDENTIALS", "").strip()
try:
    data = json.loads(raw)
except json.JSONDecodeError as exc:
    print(f"::error title=Invalid AZURE_CREDENTIALS::AZURE_CREDENTIALS must be valid JSON. {exc}")
    sys.exit(1)

required = ["clientId", "clientSecret", "subscriptionId", "tenantId"]
missing = [key for key in required if not data.get(key)]
if missing:
    print(
        "::error title=Invalid AZURE_CREDENTIALS::"
        "AZURE_CREDENTIALS must include clientId, clientSecret, subscriptionId, and tenantId. "
        f"Missing: {', '.join(missing)}."
    )
    sys.exit(1)
PY
          else
            for key in AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_SUBSCRIPTION_ID AZURE_TENANT_ID; do
              if [ -z "${!key:-}" ]; then
                echo "::error title=Missing Azure login secret::$key is required when AZURE_CREDENTIALS is not set."
                missing=1
              fi
            done
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
        env:
          AZURE_ACR_NAME: ${{ secrets.AZURE_ACR_NAME }}
          AZURE_CONTAINER_APP_NAME: ${{ secrets.AZURE_CONTAINER_APP_NAME }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      - name: Prepare Azure login credentials
        id: azure-creds
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${AZURE_CREDENTIALS:-}" ]; then
            python - <<'PY'
import json
import os

raw = os.environ["AZURE_CREDENTIALS"].strip()
data = json.loads(raw)
payload = {
    "clientId": data["clientId"],
    "clientSecret": data["clientSecret"],
    "subscriptionId": data["subscriptionId"],
    "tenantId": data["tenantId"],
}
with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
    fh.write(f"creds={json.dumps(payload, separators=(',', ':'))}\n")
PY
          else
            python - <<'PY'
import json
import os

payload = {
    "clientId": os.environ["AZURE_CLIENT_ID"],
    "clientSecret": os.environ["AZURE_CLIENT_SECRET"],
    "subscriptionId": os.environ["AZURE_SUBSCRIPTION_ID"],
    "tenantId": os.environ["AZURE_TENANT_ID"],
}
with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
    fh.write(f"creds={json.dumps(payload, separators=(',', ':'))}\n")
PY
          fi
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ steps.azure-creds.outputs.creds }}

      - name: Build and deploy backend Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          appSourcePath: ${{ github.workspace }}/backend
          acrName: ${{ secrets.AZURE_ACR_NAME }}
          containerAppName: ${{ secrets.AZURE_CONTAINER_APP_NAME }}
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          imageToBuild: ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/samudhyanrides-backend:${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

  smoke:
    needs: deploy
    uses: ./.github/workflows/post-deploy-smoke.yml
    with:
      frontend_url: ${{ vars.PRODUCTION_FRONTEND_URL || 'https://samudhyanrides.vercel.app' }}
      backend_url: ${{ vars.PRODUCTION_BACKEND_URL || 'https://samudhyanrides-api.purplerock-a57ae792.francecentral.azurecontainerapps.io' }}
